server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/* geht an das Backend -- der Express-Server erwartet den /api-Praefix bereits selbst
    # (siehe backend/src/index.ts), daher wird der Pfad unveraendert weitergereicht.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite haengt Content-Hashes an Dateinamen in /assets/ -- diese Dateien aendern sich nie
    # unter demselben Namen und duerfen daher langfristig gecacht werden.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA-Fallback: React Router uebernimmt clientseitiges Routing, jede unbekannte Route liefert
    # index.html statt eines 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
