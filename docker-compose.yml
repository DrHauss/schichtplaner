services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      # Pflicht im Produktivbetrieb -- ohne gesetzte Variable bricht der Start ab (siehe unten).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein (z. B. per .env, siehe .env.example)}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      # Enthaelt die einzige Datenhaltung der Anwendung (SQLite) -- muss Deploys/Neustarts
      # ueberstehen, siehe README fuer Backup-Hinweise.
      - schichtweb-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  schichtweb-data:
